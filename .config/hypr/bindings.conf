# Close window
bind = SUPER, W, killactive,

# Control tiling
bind = SUPER CTRL, J, layoutmsg, togglesplit # dwindle
bind = SUPER SHIFT, P, pseudo, # dwindle
bind = SUPER, T, togglefloating,
bind = SUPER, semicolon, togglegroup # stacked
bind = SUPER, F, fullscreen,

# Move focus with mainMod + arrow keys
bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, L, movefocus, r
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = SUPER, code:10, workspace, 1
bind = SUPER, code:11, workspace, 2
bind = SUPER, code:12, workspace, 3
bind = SUPER, code:13, workspace, 4
bind = SUPER, code:14, workspace, 5
bind = SUPER, code:15, workspace, 6
bind = SUPER, code:16, workspace, 7
bind = SUPER, code:17, workspace, 8
bind = SUPER, code:18, workspace, 9
bind = SUPER, code:19, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = SUPER SHIFT, code:10, movetoworkspace, 1
bind = SUPER SHIFT, code:11, movetoworkspace, 2
bind = SUPER SHIFT, code:12, movetoworkspace, 3
bind = SUPER SHIFT, code:13, movetoworkspace, 4
bind = SUPER SHIFT, code:14, movetoworkspace, 5
bind = SUPER SHIFT, code:15, movetoworkspace, 6
bind = SUPER SHIFT, code:16, movetoworkspace, 7
bind = SUPER SHIFT, code:17, movetoworkspace, 8
bind = SUPER SHIFT, code:18, movetoworkspace, 9
bind = SUPER SHIFT, code:19, movetoworkspace, 10

# Move current workspace to another monitor
bind = SUPER ALT, left, movecurrentworkspacetomonitor, +1
bind = SUPER ALT, right, movecurrentworkspacetomonitor, -1

# Swap active window with the one next to it with mainMod + SHIFT + arrow keys
bind = SUPER SHIFT, H, swapwindow, l
bind = SUPER SHIFT, J, swapwindow, d
bind = SUPER SHIFT, K, swapwindow, u
bind = SUPER SHIFT, L, swapwindow, r
bind = SUPER SHIFT, left, swapwindow, l
bind = SUPER SHIFT, right, swapwindow, r
bind = SUPER SHIFT, up, swapwindow, u
bind = SUPER SHIFT, down, swapwindow, d

# Resize active window
bind = SUPER, minus, resizeactive, -100 0
bind = SUPER, equal, resizeactive, 100 0
bind = SUPER SHIFT, minus, resizeactive, 0 -100
bind = SUPER SHIFT, equal, resizeactive, 0 100

# Scroll through existing workspaces with mainMod + scroll
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# PWA Website keybinds
bind = SUPER CTRL, L, exec, helium-browser --app="https://t3.chat"
bind = SUPER CTRL, E, exec, helium-browser --app="https://gmail.com"
bind = SUPER CTRL, Y, exec, helium-browser --app="https://youtube.com"
bind = SUPER CTRL, X, exec, helium-browser --app="https://x.com"
bind = SUPER CTRL, W, exec, helium-browser --app="https://web.whatsapp.com"
bind = SUPER CTRL, C, exec, helium-browser --app="https://cobalt.tools"
bind = SUPER CTRL, G, exec, helium-browser --app="https://github.com"
bind = SUPER CTRL, N, exec, helium-browser --app="https://notion.so"
bind = SUPER CTRL, D, exec, helium-browser --app="https://app.devin.ai"

# Screenshots
bind = , HOME, exec, grim -g "$(slurp)" - | wl-copy
bind = , F10, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, HOME, exec, grim - | wl-copy
bind = CTRL, HOME, exec, grim

# Color picker
bind = SUPER, PRINT, exec, hyprpicker -a

